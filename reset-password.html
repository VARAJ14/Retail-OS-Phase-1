<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRENZOS RETAIL - Reset Password</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="min-h-screen flex items-center justify-center px-4 py-8">
    <section class="w-full max-w-md">
      <div class="mb-6 flex items-center justify-center gap-3">
        <div class="h-12 w-12 rounded-2xl bg-indigo-500 flex items-center justify-center font-black shadow-lg shadow-indigo-500/30">
          T
        </div>

        <div>
          <h1 class="text-xl font-semibold tracking-tight">TRENZOS RETAIL</h1>
          <p class="text-xs text-slate-400">Create New Password</p>
        </div>
      </div>

      <div class="rounded-[2rem] border border-white/10 bg-white/[0.06] shadow-2xl shadow-black/40 backdrop-blur-xl overflow-hidden">
        <div class="border-b border-white/10 bg-white/[0.03] px-6 py-5">
          <p class="text-xs uppercase tracking-[0.28em] text-indigo-300">Secure Reset</p>
          <h2 class="mt-2 text-2xl font-semibold">Set a new password</h2>
        </div>

        <form id="resetPasswordForm" class="space-y-5 px-6 py-6">
          <div>
            <label for="newPassword" class="text-sm font-medium text-slate-300">New password</label>
            <input
              id="newPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Enter new password"
              class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-sm outline-none transition placeholder:text-slate-600 focus:border-indigo-400"
              required
            />
          </div>

          <div>
            <label for="confirmPassword" class="text-sm font-medium text-slate-300">Confirm password</label>
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Confirm new password"
              class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-sm outline-none transition placeholder:text-slate-600 focus:border-indigo-400"
              required
            />
          </div>

          <div id="resetAlert" class="hidden rounded-2xl border border-red-400/30 bg-red-400/10 px-4 py-3">
            <p class="text-sm font-medium text-red-300">Password reset failed</p>
            <p id="resetAlertText" class="mt-1 text-xs text-red-200">
              Passwords do not match.
            </p>
          </div>

          <div class="rounded-2xl border border-slate-800 bg-slate-950/70 p-4">
            <p class="text-sm font-medium">Password policy</p>

            <div class="mt-3 space-y-2 text-xs text-slate-400">
              <div class="flex items-center justify-between">
                <span>Minimum 8 characters</span>
                <span class="text-emerald-300">Required</span>
              </div>

              <div class="flex items-center justify-between">
                <span>Uppercase, lowercase and number</span>
                <span class="text-emerald-300">Required</span>
              </div>

              <div class="flex items-center justify-between">
                <span>Session token refresh</span>
                <span class="text-cyan-300">Automatic</span>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-indigo-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-400"
          >
            Reset password securely
          </button>
        </form>

        <footer class="border-t border-white/10 bg-slate-950/60 px-6 py-4">
          <div class="flex items-center justify-between">
            <p class="text-xs text-slate-400">Encrypted reset session</p>
            <p class="text-xs text-slate-500">RBAC preserved</p>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="shared/rbac.js"></script>
  <script src="shared/session.js"></script>
  <script src="shared/auth.js"></script>
</body>
</html>
<button onclick="window.location.href='index.html'">
  Reset Password
</button>
