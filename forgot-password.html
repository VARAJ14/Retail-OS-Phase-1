<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRENZOS RETAIL - Forgot Password</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="min-h-screen flex items-center justify-center px-4 py-8">
    <section class="w-full max-w-md">
      <div class="mb-6 flex items-center justify-center gap-3">
        <div class="h-12 w-12 rounded-2xl bg-indigo-500 flex items-center justify-center font-black shadow-lg shadow-indigo-500/30">
          T
        </div>

        <div>
          <h1 class="text-xl font-semibold tracking-tight">TRENZOS RETAIL</h1>
          <p class="text-xs text-slate-400">Password Recovery</p>
        </div>
      </div>

      <div class="rounded-[2rem] border border-white/10 bg-white/[0.06] shadow-2xl shadow-black/40 backdrop-blur-xl overflow-hidden">
        <div class="border-b border-white/10 bg-white/[0.03] px-6 py-5">
          <p class="text-xs uppercase tracking-[0.28em] text-cyan-300">Secure Recovery</p>
          <h2 class="mt-2 text-2xl font-semibold">Reset your password</h2>
        </div>

        <form id="forgotPasswordForm" class="space-y-5 px-6 py-6">
          <div>
            <label for="recoveryEmail" class="text-sm font-medium text-slate-300">Registered email address</label>
            <input
              id="recoveryEmail"
              type="email"
              autocomplete="email"
              placeholder="name@trenzosretail.com"
              class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-sm outline-none transition placeholder:text-slate-600 focus:border-indigo-400"
              required
            />
          </div>

          <div>
            <label for="recoveryRole" class="text-sm font-medium text-slate-300">Account role</label>
            <select
              id="recoveryRole"
              class="mt-2 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-sm outline-none transition focus:border-indigo-400"
              required
            >
              <option value="owner">Owner</option>
              <option value="manager">Manager</option>
              <option value="cashier">Cashier</option>
              <option value="staff">Staff</option>
            </select>
          </div>

          <div class="rounded-2xl border border-slate-800 bg-slate-950/70 p-4">
            <div class="flex items-start gap-3">
              <span class="mt-1 h-2 w-2 rounded-full bg-emerald-400"></span>
              <div>
                <p class="text-sm font-medium">Encrypted OTP delivery</p>
                <p class="mt-1 text-xs text-slate-400">
                  A one-time verification code will be sent to the registered operational email.
                </p>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-indigo-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-400"
          >
            Send verification code
          </button>

          <a
          href='index.html'
            class="block w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-center text-sm font-medium text-slate-300 transition hover:bg-slate-900"
          >
            Back to secure login
          </a>
        </form>

        <footer class="border-t border-white/10 bg-slate-950/60 px-6 py-4">
          <div class="flex items-center justify-between">
            <p class="text-xs text-slate-400">Recovery session encrypted</p>
            <p class="text-xs text-slate-500">OTP required</p>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="shared/rbac.js"></script>
  <script src="shared/session.js"></script>
  <script src="shared/auth.js"></script>
</body>
</html>
<button onclick="window.location.href='verify-otp.html'">
  Send OTP
</button>
