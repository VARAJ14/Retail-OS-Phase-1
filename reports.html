<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRENZ OS RETAIL - Reports</title>
 <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100">
  <div class="min-h-screen flex">
    <aside class="hidden lg:flex w-72 shrink-0 flex-col border-r border-slate-800 bg-slate-950">
      <div class="h-20 flex items-center gap-3 px-6 border-b border-slate-800">
        <div class="h-11 w-11 rounded-2xl bg-indigo-500 flex items-center justify-center font-black">T</div>
        <div><h1 class="font-semibold">TRENZ OS</h1><p class="text-xs text-slate-400">Reports</p></div>
      </div>
      <nav class="flex-1 overflow-y-auto px-4 py-5 space-y-1 text-sm">
        <a href="analytics.html" class="block rounded-xl text-slate-300 hover:bg-slate-900 px-4 py-3">Analytics</a>
        <a href="reports.html" class="flex items-center justify-between rounded-xl bg-indigo-500/15 text-indigo-200 px-4 py-3"><span>Reports</span><span class="text-xs">Exports</span></a>
      </nav>
    </aside>

    <div class="flex-1 min-w-0">
      <header class="sticky top-0 z-30 h-20 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
        <div class="h-full flex items-center justify-between px-5 lg:px-8">
          <div><h2 class="text-lg font-semibold">Reports & Exports</h2><p class="text-xs text-slate-400">GST, inventory, returns, CRM and campaign exports</p></div>
          <button class="rounded-xl bg-indigo-500 px-4 py-2.5 text-sm font-semibold">Schedule Report</button>
        </div>
      </header>

      <main class="p-5 lg:p-8 space-y-6">
        <section class="rounded-3xl border border-slate-800 bg-slate-900 p-6">
          <h1 class="text-3xl font-semibold">Operational reporting center</h1>
          <p class="mt-2 text-sm text-slate-400">Generate connected reports from all RetailOS modules.</p>
        </section>

        <section class="rounded-3xl border border-slate-800 bg-slate-900 overflow-hidden">
          <div class="p-5 border-b border-slate-800"><h3 class="font-semibold">Report library</h3></div>
          <div class="overflow-x-auto">
            <table class="w-full min-w-[900px] text-sm">
              <thead class="bg-slate-950 text-slate-400">
                <tr><th class="text-left px-5 py-3">Report</th><th class="text-left px-5 py-3">Data</th><th class="text-left px-5 py-3">Format</th><th class="text-left px-5 py-3">Frequency</th><th class="text-left px-5 py-3">Owner</th><th class="text-right px-5 py-3">Action</th></tr>
              </thead>
              <tbody id="reportRows" class="divide-y divide-slate-800"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="shared/analytics-data.js"></script>
  <script src="shared/analytics-flow.js"></script>
  <script>renderReportRows("reportRows");</script>
</body>
</html>
