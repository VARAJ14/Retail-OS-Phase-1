<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRENZOS RETAIL - Verify OTP</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="min-h-screen flex items-center justify-center px-4 py-8">
    <section class="w-full max-w-md">
      <div class="mb-6 flex items-center justify-center gap-3">
        <div class="h-12 w-12 rounded-2xl bg-indigo-500 flex items-center justify-center font-black shadow-lg shadow-indigo-500/30">
          T
        </div>

        <div>
          <h1 class="text-xl font-semibold tracking-tight">TRENZOS RETAIL</h1>
          <p class="text-xs text-slate-400">OTP Verification</p>
        </div>
      </div>

      <div class="rounded-[2rem] border border-white/10 bg-white/[0.06] shadow-2xl shadow-black/40 backdrop-blur-xl overflow-hidden">
        <div class="border-b border-white/10 bg-white/[0.03] px-6 py-5">
          <p class="text-xs uppercase tracking-[0.28em] text-emerald-300">Identity Check</p>
          <h2 class="mt-2 text-2xl font-semibold">Enter verification code</h2>
        </div>

        <form id="verifyOtpForm" class="space-y-5 px-6 py-6">
          <div>
            <label class="text-sm font-medium text-slate-300">6-digit OTP</label>

            <div class="mt-2 grid grid-cols-6 gap-2">
              <input maxlength="1" inputmode="numeric" class="otp-input h-12 rounded-xl border border-slate-700 bg-slate-950/80 text-center text-lg font-semibold outline-none focus:border-indigo-400" />
              <input maxlength="1" inputmode="numeric" class="otp-input h-12 rounded-xl border border-slate-700 bg-slate-950/80 text-center text-lg font-semibold outline-none focus:border-indigo-400" />
              <input maxlength="1" inputmode="numeric" class="otp-input h-12 rounded-xl border border-slate-700 bg-slate-950/80 text-center text-lg font-semibold outline-none focus:border-indigo-400" />
              <input maxlength="1" inputmode="numeric" class="otp-input h-12 rounded-xl border border-slate-700 bg-slate-950/80 text-center text-lg font-semibold outline-none focus:border-indigo-400" />
              <input maxlength="1" inputmode="numeric" class="otp-input h-12 rounded-xl border border-slate-700 bg-slate-950/80 text-center text-lg font-semibold outline-none focus:border-indigo-400" />
              <input maxlength="1" inputmode="numeric" class="otp-input h-12 rounded-xl border border-slate-700 bg-slate-950/80 text-center text-lg font-semibold outline-none focus:border-indigo-400" />
            </div>

            <p class="mt-3 text-xs text-slate-500">
              Frontend demo OTP: <span class="font-medium text-slate-300">123456</span>
            </p>
          </div>

          <div id="otpAlert" class="hidden rounded-2xl border border-red-400/30 bg-red-400/10 px-4 py-3">
            <p class="text-sm font-medium text-red-300">Invalid verification code</p>
            <p class="mt-1 text-xs text-red-200">Please enter the correct OTP to continue.</p>
          </div>

          <div class="rounded-2xl border border-slate-800 bg-slate-950/70 p-4">
            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-300">OTP session</span>
              <span class="rounded-full bg-emerald-400/10 px-3 py-1 text-xs text-emerald-300">Encrypted</span>
            </div>
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-indigo-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-400"
          >
            Verify and continue
          </button>

          <a
            href="forgot-password.html"
            class="block w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-center text-sm font-medium text-slate-300 transition hover:bg-slate-900"
          >
            Resend code
          </a>
        </form>

        <footer class="border-t border-white/10 bg-slate-950/60 px-6 py-4">
          <div class="flex items-center justify-between">
            <p class="text-xs text-slate-400">Verification required</p>
            <p class="text-xs text-slate-500">Secure recovery</p>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="shared/rbac.js"></script>
  <script src="shared/session.js"></script>
  <script src="shared/auth.js"></script>
</body>
</html>
<button onclick="window.location.href='verify-otp.html'">
  Send OTP
</button>
<button onclick="window.location.href='reset-password.html'">
  Verify OTP
</button>
