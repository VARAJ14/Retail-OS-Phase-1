<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TRENZ OS RETAIL - Products</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 pb-20 md:pb-0">
  <div id="customerHeader"></div>

  <main class="mx-auto max-w-7xl px-4 py-5 space-y-6">

    <!-- Page Header -->
    <section class="rounded-[2rem] border border-slate-800 bg-slate-900 p-5 md:p-6">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-semibold">Shop products</h1>
          <p class="mt-1 text-sm text-slate-400">Filter, sort and shop from live Chennai branch stock.</p>
        </div>

        <div class="flex flex-wrap gap-2">
          <span class="rounded-full bg-emerald-500/10 text-emerald-300 px-3 py-1 text-xs">Live stock</span>
          <span class="rounded-full bg-blue-500/10 text-blue-300 px-3 py-1 text-xs">Branch pickup</span>
          <span class="rounded-full bg-indigo-500/10 text-indigo-300 px-3 py-1 text-xs">Fast checkout</span>
        </div>
      </div>
    </section>

    <!-- Filters + Grid -->
    <section class="grid grid-cols-1 lg:grid-cols-4 gap-6">

      <!-- Filters -->
      <aside class="lg:sticky lg:top-28 h-fit rounded-[2rem] border border-slate-800 bg-slate-900 p-5">
        <div class="flex items-center justify-between">
          <h2 class="font-semibold">Filters</h2>
          <button class="text-xs text-indigo-300">Clear</button>
        </div>

        <div class="mt-5 space-y-5">
          <div>
            <label class="text-xs text-slate-400">Category</label>
            <select id="categoryFilter" class="mt-2 w-full rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-indigo-400">
              <option>All</option>
              <option>Clothing</option>
              <option>Electronics</option>
              <option>Cosmetics</option>
              <option>Accessories</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400">Brand</label>
            <select id="brandFilter" class="mt-2 w-full rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-indigo-400">
              <option>All Brands</option>
              <option>TRENZ Basics</option>
              <option>Urban TRENZ</option>
              <option>SoundMax</option>
              <option>GlowHerb</option>
              <option>ColorAura</option>
              <option>TRENZ Classic</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400">Price</label>
            <select id="priceFilter" class="mt-2 w-full rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-indigo-400">
              <option>All Prices</option>
              <option>Under ₹500</option>
              <option>₹500 - ₹1,000</option>
              <option>₹1,000 - ₹2,000</option>
              <option>Above ₹2,000</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400">Availability</label>
            <select id="availabilityFilter" class="mt-2 w-full rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-indigo-400">
              <option>All Availability</option>
              <option>Anna Nagar Available</option>
              <option>Padi Available</option>
              <option>Spencer Available</option>
              <option>Low Stock</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400">Offers</label>
            <select id="offerFilter" class="mt-2 w-full rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-indigo-400">
              <option>All Products</option>
              <option>Offers Only</option>
              <option>Best Sellers</option>
              <option>New Arrivals</option>
            </select>
          </div>

          <button id="applyFilters" class="w-full rounded-xl bg-indigo-500 py-3 text-sm font-semibold hover:bg-indigo-400">
            Apply Filters
          </button>
        </div>
      </aside>

      <!-- Listing -->
      <div class="lg:col-span-3 space-y-4">
        <div class="rounded-[2rem] border border-slate-800 bg-slate-900 p-4">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <p id="resultCount" class="text-sm text-slate-400">Showing products</p>

            <select id="sortSelect" class="rounded-xl border border-slate-800 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-indigo-400">
              <option value="newest">Newest</option>
              <option value="low-high">Price low-high</option>
              <option value="high-low">Price high-low</option>
              <option value="best-selling">Best selling</option>
            </select>
          </div>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </div>
    </section>
  </main>

  <a href="cart.html" class="fixed bottom-16 left-4 right-4 z-40 rounded-2xl bg-indigo-500 py-3 text-center text-sm font-semibold shadow-2xl shadow-indigo-500/30 md:hidden">
    View Cart · Checkout
  </a>

  <div id="mobileBottomNav"></div>

  <script src="../shared/ecommerce-data.js"></script>
  <script src="../shared/ecommerce-ui.js"></script>

  <script>
    renderCustomerHeader("products");
    renderMobileBottomNav("products");

    const productGrid = document.getElementById("productGrid");
    const resultCount = document.getElementById("resultCount");
    const categoryFilter = document.getElementById("categoryFilter");
    const brandFilter = document.getElementById("brandFilter");
    const priceFilter = document.getElementById("priceFilter");
    const availabilityFilter = document.getElementById("availabilityFilter");
    const offerFilter = document.getElementById("offerFilter");
    const sortSelect = document.getElementById("sortSelect");

    const params = new URLSearchParams(window.location.search);
    const initialCategory = params.get("category");
    const initialSort = params.get("sort");
    const initialOffers = params.get("offers");

    if (initialCategory) categoryFilter.value = initialCategory;
    if (initialSort === "bestselling") sortSelect.value = "best-selling";
    if (initialSort === "newest") sortSelect.value = "newest";
    if (initialOffers === "true") offerFilter.value = "Offers Only";

    function filterProducts() {
      let products = getVisibleProducts();

      const category = categoryFilter.value;
      const brand = brandFilter.value;
      const price = priceFilter.value;
      const availability = availabilityFilter.value;
      const offer = offerFilter.value;
      const sort = sortSelect.value;

      if (category !== "All") {
        products = products.filter((product) => product.category === category);
      }

      if (brand !== "All Brands") {
        products = products.filter((product) => product.brand === brand);
      }

      if (price === "Under ₹500") {
        products = products.filter((product) => product.price < 500);
      }

      if (price === "₹500 - ₹1,000") {
        products = products.filter((product) => product.price >= 500 && product.price <= 1000);
      }

      if (price === "₹1,000 - ₹2,000") {
        products = products.filter((product) => product.price >= 1000 && product.price <= 2000);
      }

      if (price === "Above ₹2,000") {
        products = products.filter((product) => product.price > 2000);
      }

      if (availability === "Anna Nagar Available") {
        products = products.filter((product) => product.branchStock["anna-nagar"] > 0);
      }

      if (availability === "Padi Available") {
        products = products.filter((product) => product.branchStock.padi > 0);
      }

      if (availability === "Spencer Available") {
        products = products.filter((product) => product.branchStock.spencer > 0);
      }

      if (availability === "Low Stock") {
        products = products.filter((product) => product.branchStock["anna-nagar"] <= 10);
      }

      if (offer === "Offers Only") {
        products = products.filter((product) => product.offer);
      }

      if (offer === "Best Sellers") {
        products = products.filter((product) => product.bestseller);
      }

      if (offer === "New Arrivals") {
        products = products.filter((product) => product.newest);
      }

      if (sort === "low-high") {
        products.sort((a, b) => a.price - b.price);
      }

      if (sort === "high-low") {
        products.sort((a, b) => b.price - a.price);
      }

      if (sort === "best-selling") {
        products.sort((a, b) => Number(b.bestseller) - Number(a.bestseller));
      }

      if (sort === "newest") {
        products.sort((a, b) => Number(b.newest) - Number(a.newest));
      }

      resultCount.textContent = `Showing ${products.length} products`;
      productGrid.innerHTML = products.map(productCard).join("");
    }

    document.getElementById("applyFilters").addEventListener("click", filterProducts);
    sortSelect.addEventListener("change", filterProducts);

    filterProducts();
  </script>
</body>
</html>
<script src="../shared/app-db.js"></script>
<script src="../shared/ecommerce-store.js"></script>
<script>
  if (document.getElementById("productGrid")) {
    trenzRenderStoreProductCards("productGrid");
  }
</script>
